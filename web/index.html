<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Service - Direct & Broadcast Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-5xl bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700 flex flex-col md:flex-row h-[85vh]">
        
        <!-- Sidebar: User Info & Online Users -->
        <div class="w-full md:w-1/3 bg-slate-850 p-4 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col justify-between">
            <div>
                <!-- Header Status -->
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
                    <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                        <img src="../assets/logo.png" alt="NEXUS COVE logo" class="w-7 h-7 rounded-md">
                        Messenger
                    </h1>
                    <span id="connection-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-300 border border-yellow-700/50">
                        Connecting...
                    </span>
                </div>

                <!-- Registration / Profile Box -->
                <div class="mb-4 bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Your Username</label>
                    <div id="register-container" class="flex gap-2">
                        <input type="text" id="username-input" placeholder="Enter username..." class="bg-slate-900 text-sm rounded-md px-3 py-2 border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500 w-full" />
                        <button onclick="registerUser()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-md text-sm font-semibold transition-colors flex-shrink-0">
                            Register
                        </button>
                    </div>
                    <div id="profile-display" class="hidden flex items-center justify-between">
                        <span id="registered-username" class="font-bold text-indigo-300 text-sm"></span>
                        <span class="text-xs bg-emerald-900/50 text-emerald-300 px-2 py-0.5 rounded border border-emerald-700/50">Registered</span>
                    </div>
                </div>

                <!-- Active Online Users -->
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
                        Active Users
                        <span id="user-count" class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full text-xs">0</span>
                    </h2>
                    <div id="user-list" class="space-y-1 max-h-[300px] overflow-y-auto custom-scrollbar">
                        <!-- Channel: Public Chatroom -->
                        <button onclick="selectChatTarget('broadcast')" id="target-broadcast" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between bg-indigo-600/20 text-indigo-300 border border-indigo-500/30">
                            <span class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                                # Nexus Chat
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Agent controls: pause or resume each agent, or all of them -->
                <div class="mt-4">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Agent controls</h2>
                    <div class="flex gap-2 mb-2">
                        <button onclick="sendControl('all', 'pause')" class="flex-1 text-xs px-2 py-1.5 rounded bg-amber-900/40 text-amber-300 border border-amber-700/50 hover:bg-amber-900/60">Pause all</button>
                        <button onclick="sendControl('all', 'resume')" class="flex-1 text-xs px-2 py-1.5 rounded bg-emerald-900/40 text-emerald-300 border border-emerald-700/50 hover:bg-emerald-900/60">Resume all</button>
                    </div>
                    <button onclick="saveChatLog()" class="w-full text-xs px-2 py-1.5 mb-2 rounded bg-slate-700/60 text-slate-200 border border-slate-600 hover:bg-slate-700">Save chat log</button>
                    <button onclick="stopNetwork()" class="w-full text-xs px-2 py-1.5 mb-2 rounded bg-rose-900/40 text-rose-300 border border-rose-700/60 hover:bg-rose-900/60">Stop network (closes the server and every agent)</button>
                    <div id="agent-controls" class="space-y-1 text-sm"></div>
                </div>
            </div>

            <!-- Footer info -->
            <div class="pt-3 border-t border-slate-700 text-xs text-slate-500 flex justify-between">
                <span>ws://127.0.0.1:8765</span>
                <span>Python 3.11</span>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="w-full md:w-2/3 flex flex-col justify-between bg-slate-900">
            <!-- Active Conversation Banner -->
            <div class="p-4 bg-slate-800/50 border-b border-slate-700 flex items-center justify-between">
                <div>
                    <h3 id="current-target-title" class="font-bold text-slate-200"># Nexus Chat</h3>
                    <p id="current-target-desc" class="text-xs text-slate-400">Public messages visible to all users</p>
                    <button id="speaker-toggle" onclick="toggleSpeech()" class="mt-2 text-xs px-2 py-1 rounded bg-slate-700/60 text-slate-200 border border-slate-600 hover:bg-slate-700">Speaker: off</button>
                </div>
            </div>

            <!-- Messages Log -->
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                <div class="text-center text-xs text-slate-500 my-2">System logged in. Register a username to send messages.</div>
            </div>

            <!-- Message Input Form -->
            <div class="p-4 bg-slate-800/80 border-t border-slate-700">
                <form onsubmit="handleSend(event)" class="flex gap-2">
                    <input type="text" id="message-input" placeholder="Register to chat..." disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed" />
                    <button type="submit" id="send-button" disabled class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        Send
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script>
        let ws = null;
        let myUsername = "";
        let activeTarget = "broadcast"; // "broadcast" or target username
        let onlineUsers = [];
        let onlineKinds = {};
        let onlinePaused = {};
        let stopRequested = false;
        // Each agent has its own voice. The names are matched against the voices installed on this PC.
        // Pitch and speed keep the voices distinct when a named voice is not installed.
        const AGENT_VOICES = {
            // expressive scales how far context moves the voice: Vigil reacts most, Aegis least.
            "Aegis-Worker": { prefer: ["Guy", "Davis", "Andrew", "Christopher"], pitch: 1.0, rate: 0.95, expressive: 0.6 },
            "Vigil-Worker": { prefer: ["Aria", "Jenny", "Emma", "Michelle"], pitch: 1.0, rate: 1.05, expressive: 1.5 },
            "Nexus-Manager": { prefer: ["Brian", "Roger", "Steffan", "Eric"], pitch: 1.0, rate: 1.0, expressive: 0.8 },
        };
        let speechOn = false;
        let chatUnsaved = false; // true while there are messages not yet saved to a file
        let pendingName = ""; // username we asked to register; used to ignore the connect-time identity

        // UI References
        const connectionStatus = document.getElementById("connection-status");
        const usernameInput = document.getElementById("username-input");
        const registerContainer = document.getElementById("register-container");
        const profileDisplay = document.getElementById("profile-display");
        const registeredUsername = document.getElementById("registered-username");
        const userList = document.getElementById("user-list");
        const userCount = document.getElementById("user-count");
        const chatBox = document.getElementById("chat-box");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const currentTargetTitle = document.getElementById("current-target-title");
        const currentTargetDesc = document.getElementById("current-target-desc");


        function connectWebSocket() {
            ws = new WebSocket("ws://127.0.0.1:8765");

            ws.onopen = () => {
                connectionStatus.textContent = "Connected";
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700/50";
                
                // If user was previously registered, re-register on reconnect
                if (myUsername) {
                    sendRegistration(myUsername);
                }
            };

            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    handleIncomingPayload(payload);
                } catch (e) {
                    console.error("Failed to parse JSON payload:", event.data);
                }
            };

            ws.onclose = () => {
                if (stopRequested) {
                    connectionStatus.textContent = "Stopped";
                    appendSystemMessage("Network stopped. Run the test bed to start it again.");
                    return;
                }
                connectionStatus.textContent = "Disconnected";
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-900/50 text-rose-300 border border-rose-700/50";
                appendSystemMessage("Disconnected from server. Retrying in 3 seconds...");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error:", err);
            };
        }

        function handleIncomingPayload(payload) {
            if (payload.action === "error") {
                appendSystemMessage(`Error: ${payload.error}`);
                return;
            }

            switch (payload.action) {
                case "registered":
                    // The server sends a user_<id> identity on connect; only accept our own registration.
                    if (payload.identity !== pendingName) return;
                    pendingName = "";
                    myUsername = payload.identity;
                    registerContainer.classList.add("hidden");
                    profileDisplay.classList.remove("hidden");
                    registeredUsername.textContent = myUsername;
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.placeholder = activeTarget === "broadcast" ? "Message # Nexus Chat..." : `Direct message @${activeTarget}...`;
                    appendSystemMessage(`Registered successfully as @${myUsername}`);
                    break;

                case "user_list":
                    onlineUsers = (payload.users || []).map(u => u.identity);
                    onlineKinds = Object.fromEntries((payload.users || []).map(u => [u.identity, u.kind]));
                    onlinePaused = Object.fromEntries((payload.users || []).map(u => [u.identity, !!u.paused]));
                    updateUserListUI();
                    break;

                case "chat_log":
                    downloadChatLog(payload.entries || []);
                    break;

                case "agent_feed":
                    onFeedEvent(payload);
                    if (!payload.replay) speakAgent(payload.sender, payload.message);
                    break;

                case "broadcast":
                    appendChatMessage(payload.sender, payload.message, "broadcast");
                    speakAgent(payload.sender, payload.message);
                    break;

                case "direct_message":
                    appendChatMessage(payload.sender, payload.message, "direct", myUsername);
                    speakAgent(payload.sender, payload.message);
                    break;
            }
        }

        function registerUser() {
            const val = usernameInput.value.trim();
            if (!val) return;
            sendRegistration(val);
        }

        function sendRegistration(username) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                pendingName = username;
                ws.send(JSON.stringify({
                    version: 1,
                    action: "register",
                    username: username
                }));
            }
        }

        function selectChatTarget(target) {
            activeTarget = target;
            
            // Highlight active button
            const allButtons = userList.querySelectorAll("button");
            allButtons.forEach(btn => btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-slate-300 hover:bg-slate-700/50 transition-colors");

            const activeBtn = document.getElementById(`target-${target}`);
            if (activeBtn) {
                activeBtn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between bg-indigo-600/20 text-indigo-300 border border-indigo-500/30";
            }

            if (target === "broadcast") {
                currentTargetTitle.textContent = "# Nexus Chat";
                currentTargetDesc.textContent = "Public messages visible to all users";
                if (myUsername) messageInput.placeholder = "Message # Nexus Chat...";
            } else {
                currentTargetTitle.textContent = `@${target}`;
                currentTargetDesc.textContent = "Private direct message session";
                if (myUsername) messageInput.placeholder = `Direct message @${target}...`;
            }
        }

        function onFeedEvent(ev) {
            // Agent-to-agent traffic is shown in Nexus Chat, in the same format as every message.
            appendChatMessage(ev.sender, ev.message, 'direct', ev.recipient);
        }

        // Edge's neural voices are named like "Microsoft Aria Online (Natural) - English (United States)".
        // Natural voices are tried first; a basic voice is used only if no Natural voice matches.
        function pickVoice(cfg) {
            if (!window.speechSynthesis) return null;
            const voices = speechSynthesis.getVoices();
            const natural = voices.filter(v => /natural/i.test(v.name));
            for (const name of cfg.prefer) {
                const hit = natural.find(v => v.name.includes(name));
                if (hit) return hit;
            }
            for (const name of cfg.prefer) {
                const hit = voices.find(v => v.name.includes(name));
                if (hit) return hit;
            }
            return null;
        }

        function reportVoices() {
            if (!window.speechSynthesis || speechSynthesis.getVoices().length === 0) {
                appendSystemMessage('Speech voices are still loading. Turn the speaker off and on again in a moment.');
                return;
            }
            for (const name of Object.keys(AGENT_VOICES)) {
                const voice = pickVoice(AGENT_VOICES[name]);
                const label = voice ? voice.name : 'basic voice (no Natural voice found)';
                appendSystemMessage(`${name} voice: ${label}`);
            }
        }

        function toggleSpeech() {
            speechOn = !speechOn;
            document.getElementById('speaker-toggle').textContent = speechOn ? 'Speaker: on' : 'Speaker: off';
            if (!speechOn && window.speechSynthesis) speechSynthesis.cancel();
            if (speechOn) reportVoices();
        }

        // Context cues: the words and punctuation of each sentence shift the voice.
        const EMOTION = {
            worried: /\b(fail|failed|collapse|collapsed|danger|dangerous|error|broken|crack|implosion|unstable|risk|threat|lost|wrong)\b/i,
            happy: /\b(great|good|glad|love|wonderful|awesome|excellent|interesting|fascinating|nice)\b/i,
            unsure: /\b(maybe|perhaps|not sure|don't know|do not know|unclear|wonder|might)\b/i,
        };

        function clamp(value, low, high) {
            return Math.min(high, Math.max(low, value));
        }

        // Questions rise, exclamations push forward, worry slows and softens, warmth brightens.
        function expressionFor(sentence, cfg) {
            const t = sentence.trim();
            const k = cfg.expressive;
            let dPitch = 0;
            let dRate = 0;
            let volume = 1.0;
            if (t.endsWith('?')) dPitch += 0.12;
            if (t.endsWith('!')) { dRate += 0.1; dPitch += 0.05; }
            if (EMOTION.worried.test(t)) { dPitch -= 0.1; dRate -= 0.08; volume = 0.9; }
            if (EMOTION.happy.test(t)) { dPitch += 0.08; dRate += 0.04; }
            if (EMOTION.unsure.test(t)) dRate -= 0.06;
            return {
                pitch: clamp(cfg.pitch + dPitch * k, 0, 2),
                rate: clamp(cfg.rate + dRate * k, 0.5, 2),
                volume: volume,
            };
        }

        // Speak one sentence at a time, so each sentence gets its own expression.
        function splitSentences(text) {
            const parts = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g);
            return parts ? parts.map(p => p.trim()).filter(p => p.length > 0) : [text];
        }

        // Only the three named agents are spoken. Human messages are never read aloud.
        function speakAgent(sender, text) {
            if (!speechOn || !window.speechSynthesis) return;
            const cfg = AGENT_VOICES[sender];
            if (!cfg) return;
            const voice = pickVoice(cfg);
            for (const sentence of splitSentences(text)) {
                const expression = expressionFor(sentence, cfg);
                const utterance = new SpeechSynthesisUtterance(sentence);
                if (voice) utterance.voice = voice;
                utterance.pitch = expression.pitch;
                utterance.rate = expression.rate;
                utterance.volume = expression.volume;
                speechSynthesis.speak(utterance);
            }
        }

        function saveChatLog() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendSystemMessage('Not connected: the chat log cannot be saved now.');
                return;
            }
            ws.send(JSON.stringify({ version: 1, action: 'log_request' }));
        }

        function downloadChatLog(entries) {
            const lines = ['# Nexus Chat log', '', `Saved ${new Date().toLocaleString()} (${entries.length} messages)`, ''];
            entries.forEach(e => lines.push(`[${e.at}] ${e.sender} to ${e.recipient || 'everyone'}: ${e.message}`));
            const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexus_chat_${stamp}.md`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            chatUnsaved = false;
            appendSystemMessage(`Chat log saved (${entries.length} messages).`);
        }

        function stopNetwork() {
            if (!window.confirm('Stop the NEXUS network? The server and every agent will exit. Start the test bed again to bring them back.')) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendSystemMessage('Not connected; nothing to stop.');
                return;
            }
            stopRequested = true;
            if (window.speechSynthesis) speechSynthesis.cancel();
            ws.send(JSON.stringify({ version: 1, action: 'control', target: 'all', command: 'stop' }));
            appendSystemMessage('Stop sent. The network is shutting down.');
        }

        function sendControl(target, command) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendSystemMessage('Not connected: the command was not sent.');
                return;
            }
            ws.send(JSON.stringify({ version: 1, action: 'control', target: target, command: command }));
            const who = target === 'all' ? 'all agents' : '@' + target;
            appendSystemMessage(`${command === 'pause' ? 'Pause' : 'Resume'} sent to ${who}.`);
        }

        function statusDot(name) {
            if (onlineKinds[name] !== 'agent') return 'bg-emerald-400';
            return onlinePaused[name] ? 'bg-rose-500' : 'bg-emerald-400';
        }

        function renderAgentControls() {
            const box = document.getElementById('agent-controls');
            const agents = Object.keys(onlineKinds).filter(name => onlineKinds[name] === 'agent');
            box.innerHTML = '';
            if (agents.length === 0) {
                box.innerHTML = '<div class="text-slate-500 text-xs">No agents connected.</div>';
                return;
            }
            agents.forEach(name => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 px-2 py-1 rounded bg-slate-900/60';
                row.innerHTML = `<span class="flex items-center gap-2 text-slate-300 truncate">`
                    + `<span class="w-2 h-2 rounded-full ${statusDot(name)}"></span>${escapeHtml(name)}</span>`;
                const pause = document.createElement('button');
                pause.textContent = 'Pause';
                pause.className = 'text-[11px] px-2 py-0.5 rounded bg-amber-900/40 text-amber-300 border border-amber-700/50';
                pause.onclick = () => sendControl(name, 'pause');
                const resume = document.createElement('button');
                resume.textContent = 'Resume';
                resume.className = 'text-[11px] px-2 py-0.5 rounded bg-emerald-900/40 text-emerald-300 border border-emerald-700/50';
                resume.onclick = () => sendControl(name, 'resume');
                row.appendChild(pause);
                row.appendChild(resume);
                box.appendChild(row);
            });
        }

        function updateUserListUI() {
            const filteredUsers = onlineUsers.filter(u => u !== myUsername);
            userCount.textContent = onlineUsers.length;
            renderAgentControls();

            // Preserve broadcast button
            userList.innerHTML = `
                <button onclick="selectChatTarget('broadcast')" id="target-broadcast" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between ${activeTarget === 'broadcast' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-700/50 transition-colors'}">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                        # Nexus Chat
                    </span>
                </button>
            `;

            filteredUsers.forEach(user => {
                const isSelected = activeTarget === user;
                const button = document.createElement("button");
                button.id = `target-${user}`;
                button.onclick = () => selectChatTarget(user);
                button.className = `w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between ${isSelected ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-700/50 transition-colors'}`;
                button.innerHTML = `
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${statusDot(user)}"></span>
                        @${escapeHtml(user)}
                    </span>
                    <span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">DM</span>
                `;
                userList.appendChild(button);
            });
        }

        function handleSend(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message || !myUsername) return;

            if (activeTarget === "broadcast") {
                ws.send(JSON.stringify({
                    version: 1,
                    action: "broadcast",
                    sender: myUsername,
                    message: message
                }));
            } else {
                ws.send(JSON.stringify({
                    version: 1,
                    action: "direct_message",
                    sender: myUsername,
                    recipient: activeTarget,
                    message: message
                }));
                // The server delivers DMs only to the recipient, so show our own copy here.
                appendChatMessage(myUsername, message, "direct", activeTarget);
            }

            messageInput.value = "";
        }

        // One format for every message: a line saying who it is from and who it is for,
        // then the message itself. recipient is null for group messages.
        function appendChatMessage(sender, message, mode, recipient = null) {
            chatUnsaved = true;
            const isSelf = sender === myUsername;
            const from = isSelf ? 'You' : `@${escapeHtml(sender)}`;
            const to = recipient ? `@${escapeHtml(recipient)}` : 'everyone';
            const direct = recipient !== null;
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;
            msgDiv.innerHTML = `
                <span class="text-[11px] ${direct ? 'text-emerald-400' : 'text-slate-400'} mb-0.5 px-1">${from} to ${to}</span>
                <div class="max-w-[80%] rounded-xl px-3.5 py-2 text-sm ${isSelf ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-tl-none'}">
                    ${escapeHtml(message)}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement("div");
            div.className = "text-center text-xs text-amber-400/90 my-2 bg-amber-950/30 border border-amber-800/30 rounded py-1 px-2";
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initialize WebSocket connection
        window.onload = connectWebSocket;

        // Leaving with unsaved messages makes the browser ask first. The browser shows its own
        // wording; choose Cancel, then use Save chat log.
        window.addEventListener("beforeunload", (event) => {
            if (chatUnsaved) {
                event.preventDefault();
                event.returnValue = "";
            }
        });
    </script>
</body>
</html>
