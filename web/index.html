<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS COVE - Multi-Agent Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @media (max-width: 767px) {
            #nexus-sidebar {
                position: fixed !important;
                top: 0 !important; left: 0 !important; bottom: 0 !important;
                width: 85vw !important; max-width: 340px !important;
                transform: translateX(-100%);
                transition: transform 0.22s ease;
                z-index: 100 !important;
                overflow-y: auto;
                background: #1e293b !important;
            }
            #nexus-sidebar:target { transform: translateX(0); }
        }
        .nexus-menu-btn {
            display: none;
            background: rgba(15,23,42,0.95); color: #e2e8f0;
            border: 1px solid #475569; border-radius: 8px;
            padding: 8px 12px; font-size: 15px; line-height: 1;
            cursor: pointer; user-select: none; font-weight: 600;
        }
        @media (max-width: 767px) {
            .nexus-menu-btn { display: inline-flex; }
        }
        .nexus-close-btn {
            display: none; position: absolute; top: 6px; right: 10px;
            font-size: 28px; line-height: 1; text-decoration: none;
            color: #94a3b8; padding: 4px 10px; z-index: 200; font-weight: bold;
        }
        @media (max-width: 767px) { .nexus-close-btn { display: block; } }
    </style>
    <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body class="flex flex-col h-full">
    <!-- App Container: fills ENTIRE viewport, flex column (no max-width, no centering, no rounding) -->
    <div id="app" class="flex flex-col h-full w-full bg-slate-900 overflow-hidden">

        <!-- Top Bar (fixed height - flex-shrink-0) -->
        <div class="flex-shrink-0 px-4 py-2 bg-slate-800/50 border-b border-slate-700 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <a href="#nexus-sidebar" class="nexus-menu-btn" aria-label="Menu">&#9776; Menu</a>
                <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                    <img src="../assets/logo.png" alt="NEXUS COVE logo" class="w-7 h-7 rounded-md">
                    NEXUS COVE
                </h1>
            </div>
            <span id="connection-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-300 border border-yellow-700/50">
                Connecting...
            </span>
        </div>

        <!-- Main Content Area: Sidebar + Chat (fills remaining viewport) -->
        <div class="flex-1 min-h-0 flex flex-row overflow-hidden">

            <!-- Sidebar: User Info & Online Users (fixed width, own scroll) -->
            <div id="nexus-sidebar" class="w-full md:w-1/3 flex-shrink-0 relative bg-slate-850 p-4 border-r border-slate-700 flex flex-col overflow-y-auto custom-scrollbar">
                <a href="#" class="nexus-close-btn" aria-label="Close">&#215;</a>

                <!-- Registration / Profile Box (fixed) -->
                <div class="mb-4 bg-slate-800/80 p-3 rounded-lg border border-slate-700 flex-shrink-0">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Your Username</label>
                    <div id="register-container" class="flex gap-2">
                        <input type="text" id="username-input" placeholder="Enter username..." class="bg-slate-900 text-sm rounded-md px-3 py-2 border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500 w-full" />
                        <button onclick="registerUser()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-md text-sm font-semibold transition-colors flex-shrink-0">
                            Register
                        </button>
                    </div>
                    <div id="profile-display" class="hidden flex items-center justify-between mt-2">
                        <span id="registered-username" class="font-bold text-indigo-300 text-sm"></span>
                        <span class="text-xs bg-emerald-900/50 text-emerald-300 px-2 py-0.5 rounded border border-emerald-700/50">Registered</span>
                    </div>
                </div>

                <!-- Active Online Users (scrollable) -->
                <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-center">
                        Active Users
                        <span id="user-count" class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full text-xs">0</span>
                    </h2>
                    <div id="user-list" class="space-y-1">
                        <button onclick="selectChatTarget('broadcast')" id="target-broadcast" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between bg-indigo-600/20 text-indigo-300 border border-indigo-500/30">
                            <span class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                                # Nexus Chat
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Agent controls (fixed) -->
                <div class="mt-4 flex-shrink-0">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Agent controls</h2>
                    <div class="flex gap-2 mb-2">
                        <button onclick="sendControl('all', 'pause')" class="flex-1 text-xs px-2 py-1.5 rounded bg-amber-900/40 text-amber-300 border border-amber-700/50 hover:bg-amber-900/60">Pause all</button>
                        <button onclick="sendControl('all', 'resume')" class="flex-1 text-xs px-2 py-1.5 rounded bg-emerald-900/40 text-emerald-300 border border-emerald-700/50 hover:bg-emerald-900/60">Resume all</button>
                    </div>
                    <button onclick="saveChatLog()" class="w-full text-xs px-2 py-1.5 mb-2 rounded bg-slate-700/60 text-slate-200 border border-slate-600 hover:bg-slate-700">Save chat log</button>
                    <button onclick="stopNetwork()" class="w-full text-xs px-2 py-1.5 mb-2 rounded bg-rose-900/40 text-rose-300 border border-rose-700/60 hover:bg-rose-900/60">Stop network</button>
                    <div id="agent-controls" class="space-y-1 text-sm"></div>
                </div>

                <!-- Footer info (fixed) -->
                <div class="pt-3 border-t border-slate-700 text-xs text-slate-500 flex justify-between flex-shrink-0">
                    <span>ws://127.0.0.1:8765</span>
                    <span>Python 3.11</span>
                </div>
            </div>

            <!-- Chat Area: Grid layout - fixed header, scrollable middle, fixed input -->
            <div class="w-full md:w-2/3 flex-1 min-h-0 bg-slate-900 grid grid-rows-[auto_1fr_auto]">

                <!-- Active Conversation Banner (fixed height - auto row) -->
                <div id="nexus-chat-header" class="p-4 bg-slate-800/50 border-b border-slate-700 flex justify-center flex-shrink-0">
                    <div id="nexus-chat-title-block" class="text-center py-2">
                        <h3 id="current-target-title" class="font-bold text-slate-200"># Nexus Chat</h3>
                        <p id="current-target-desc" class="text-xs text-slate-400">Public messages visible to all users</p>
                        <button id="speaker-toggle" onclick="toggleSpeech()" class="mt-2 text-xs px-2 py-1 rounded bg-slate-700/60 text-slate-200 border border-slate-600 hover:bg-slate-700">Speaker: off</button>
                    </div>
                </div>

                <!-- Messages Log (fills remaining space - 1fr row, scrolls internally) -->
                <div id="chat-box" class="p-4 overflow-y-auto space-y-3 custom-scrollbar min-h-0">
                    <div class="text-center text-xs text-slate-500 my-2">System logged in. Register a username to send messages.</div>
                </div>

                <!-- Message Input Form (fixed at bottom - auto row) -->
                <div class="p-4 bg-slate-800/80 border-t border-slate-700 flex-shrink-0">
                    <form onsubmit="handleSend(event)" class="flex gap-2">
                        <input type="text" id="message-input" placeholder="Register to chat..." disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed" />
                        <button type="submit" id="send-button" disabled class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Send
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let myUsername = "";
        let activeTarget = "broadcast";
        let onlineUsers = [];
        let onlineKinds = {};
        let onlinePaused = {};
        let stopRequested = false;
        const AGENT_VOICES = {
            "Aegis-Worker": { voice: "Microsoft David", pitch: 1.0, rate: 0.95, expressive: 0.6 },
            "Vigil-Worker": { voice: "Samantha", pitch: 1.0, rate: 1.05, expressive: 1.5 },
            "Elon-Worker": { voice: "Microsoft Mark", pitch: 0.7, rate: 0.85, expressive: 0.2 },
            "Nexus-Manager": { voice: "Google UK English Female", pitch: 1.0, rate: 1.0, expressive: 0.8 },
        };
        let speechOn = false;
        let chatUnsaved = false;
        let pendingName = "";

        const connectionStatus = document.getElementById("connection-status");
        const usernameInput = document.getElementById("username-input");
        const registerContainer = document.getElementById("register-container");
        const profileDisplay = document.getElementById("profile-display");
        const registeredUsername = document.getElementById("registered-username");
        const userList = document.getElementById("user-list");
        const userCount = document.getElementById("user-count");
        const chatBox = document.getElementById("chat-box");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const currentTargetTitle = document.getElementById("current-target-title");
        const currentTargetDesc = document.getElementById("current-target-desc");

        function connectWebSocket() {
            ws = new WebSocket("ws://127.0.0.1:8765");

            ws.onopen = () => {
                connectionStatus.textContent = "Connected";
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700/50";
                if (myUsername) sendRegistration(myUsername);
            };

            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    handleIncomingPayload(payload);
                } catch (e) {
                    console.error("Failed to parse JSON payload:", event.data);
                }
            };

            ws.onclose = () => {
                if (stopRequested) {
                    connectionStatus.textContent = "Stopped";
                    appendSystemMessage("Network stopped. Run the test bed to start it again.");
                    return;
                }
                connectionStatus.textContent = "Disconnected";
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-900/50 text-rose-300 border border-rose-700/50";
                appendSystemMessage("Disconnected from server. Retrying in 3 seconds...");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => { console.error("WebSocket error:", err); };
        }

        function handleIncomingPayload(payload) {
            if (payload.action === "error") {
                appendSystemMessage(`Error: ${payload.error}`);
                return;
            }
            switch (payload.action) {
                case "registered":
                    if (payload.identity !== pendingName) return;
                    pendingName = "";
                    myUsername = payload.identity;
                    registerContainer.classList.add("hidden");
                    profileDisplay.classList.remove("hidden");
                    registeredUsername.textContent = myUsername;
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.placeholder = activeTarget === "broadcast" ? "Message # Nexus Chat..." : `Direct message @${activeTarget}...`;
                    appendSystemMessage(`Registered successfully as @${myUsername}`);
                    break;
                case "user_list":
                    onlineUsers = (payload.users || []).map(u => u.identity);
                    onlineKinds = Object.fromEntries((payload.users || []).map(u => [u.identity, u.kind]));
                    onlinePaused = Object.fromEntries((payload.users || []).map(u => [u.identity, !!u.paused]));
                    updateUserListUI();
                    break;
                case "chat_log":
                    downloadChatLog(payload.entries || []);
                    break;
                case "agent_feed":
                    onFeedEvent(payload);
                    if (!payload.replay) speakAgent(payload.sender, payload.message);
                    break;
                case "broadcast":
                    appendChatMessage(payload.sender, payload.message, "broadcast");
                    speakAgent(payload.sender, payload.message);
                    break;
                case "direct_message":
                    appendChatMessage(payload.sender, payload.message, "direct", myUsername);
                    speakAgent(payload.sender, payload.message);
                    break;
            }
        }

        function registerUser() {
            const val = usernameInput.value.trim();
            if (!val) return;
            sendRegistration(val);
        }

        function sendRegistration(username) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                pendingName = username;
                ws.send(JSON.stringify({ version: 1, action: "register", username: username }));
            }
        }

        function selectChatTarget(target) {
            activeTarget = target;
            const allButtons = userList.querySelectorAll("button");
            allButtons.forEach(btn => btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between text-slate-300 hover:bg-slate-700/50 transition-colors");
            const activeBtn = document.getElementById(`target-${target}`);
            if (activeBtn) activeBtn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between bg-indigo-600/20 text-indigo-300 border border-indigo-500/30";
            if (target === "broadcast") {
                currentTargetTitle.textContent = "# Nexus Chat";
                currentTargetDesc.textContent = "Public messages visible to all users";
                if (myUsername) messageInput.placeholder = "Message # Nexus Chat...";
            } else {
                currentTargetTitle.textContent = `@${target}`;
                currentTargetDesc.textContent = "Private direct message session";
                if (myUsername) messageInput.placeholder = `Direct message @${target}...`;
            }
        }

        function onFeedEvent(ev) {
            // Agent-to-agent communications: show in unified feed with clear label
            appendChatMessage(ev.sender, ev.message, 'agent_feed', ev.recipient);
        }

        function pickVoice(cfg) {
            if (!window.speechSynthesis) return null;
            const voices = speechSynthesis.getVoices();
            const natural = voices.filter(v => /natural/i.test(v.name));
            const target = cfg.voice;
            if (!target) return null;
            // Try exact match first in natural voices
            let hit = natural.find(v => v.name === target);
            if (hit) return hit;
            // Try partial match in natural voices
            hit = natural.find(v => v.name.includes(target));
            if (hit) return hit;
            // Try exact match in all voices
            hit = voices.find(v => v.name === target);
            if (hit) return hit;
            // Try partial match in all voices
            hit = voices.find(v => v.name.includes(target));
            if (hit) return hit;
            return null;
        }

        function reportVoices() {
            if (!window.speechSynthesis || speechSynthesis.getVoices().length === 0) {
                appendSystemMessage('Speech voices are still loading. Turn the speaker off and on again in a moment.');
                return;
            }
            for (const name of Object.keys(AGENT_VOICES)) {
                const voice = pickVoice(AGENT_VOICES[name]);
                const label = voice ? voice.name : 'basic voice (no Natural voice found)';
                appendSystemMessage(`${name} voice: ${label}`);
            }
        }

        function toggleSpeech() {
            speechOn = !speechOn;
            document.getElementById('speaker-toggle').textContent = speechOn ? 'Speaker: on' : 'Speaker: off';
            if (!speechOn && window.speechSynthesis) speechSynthesis.cancel();
            if (speechOn) reportVoices();
        }

        const EMOTION = {
            worried: /\b(fail|failed|collapse|collapsed|danger|dangerous|error|broken|crack|implosion|unstable|risk|threat|lost|wrong)\b/i,
            happy: /\b(great|good|glad|love|wonderful|awesome|excellent|interesting|fascinating|nice)\b/i,
            unsure: /\b(maybe|perhaps|not sure|don't know|do not know|unclear|wonder|might)\b/i,
        };

        function clamp(value, low, high) {
            return Math.min(high, Math.max(low, value));
        }

        function expressionFor(sentence, cfg) {
            const t = sentence.trim();
            const k = cfg.expressive;
            let dPitch = 0, dRate = 0, volume = 1.0;
            if (t.endsWith('?')) dPitch += 0.12;
            if (t.endsWith('!')) { dRate += 0.1; dPitch += 0.05; }
            if (EMOTION.worried.test(t)) { dPitch -= 0.1; dRate -= 0.08; volume = 0.9; }
            if (EMOTION.happy.test(t)) { dPitch += 0.08; dRate += 0.04; }
            if (EMOTION.unsure.test(t)) dRate -= 0.06;
            return { pitch: clamp(cfg.pitch + dPitch * k, 0, 2), rate: clamp(cfg.rate + dRate * k, 0.5, 2), volume };
        }

        function splitSentences(text) {
            const parts = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g);
            return parts ? parts.map(p => p.trim()).filter(p => p.length > 0) : [text];
        }

        function speakAgent(sender, text) {
            if (!speechOn || !window.speechSynthesis) return;
            const cfg = AGENT_VOICES[sender];
            if (!cfg) return;
            if (sender === 'Elon-Worker') {
                text = text.replace(/[:;—]/g, '... ');
                text = text.replace(/\b(first principles|physics|bottleneck|orders of magnitude|fundamentally)\b/gi, '... $1');
            }
            const voice = pickVoice(cfg);
            for (const sentence of splitSentences(text)) {
                const expression = expressionFor(sentence, cfg);
                const utterance = new SpeechSynthesisUtterance(sentence);
                if (voice) utterance.voice = voice;
                utterance.pitch = expression.pitch;
                utterance.rate = expression.rate;
                utterance.volume = expression.volume;
                speechSynthesis.speak(utterance);
            }
        }

        function saveChatLog() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendSystemMessage('Not connected: the chat log cannot be saved now.');
                return;
            }
            ws.send(JSON.stringify({ version: 1, action: 'log_request' }));
        }

        function downloadChatLog(entries) {
            const lines = ['# Nexus Chat log', '', `Saved ${new Date().toLocaleString()} (${entries.length} messages)`, ''];
            entries.forEach(e => lines.push(`[${e.at}] ${e.sender} to ${e.recipient || 'everyone'}: ${e.message}`));
            const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const a = document.createElement('a');
            a.href = url; a.download = `nexus_chat_${stamp}.md`;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            chatUnsaved = false;
            appendSystemMessage(`Chat log saved (${entries.length} messages).`);
        }

        function stopNetwork() {
            if (!window.confirm('Stop the NEXUS network? The server and every agent will exit.')) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) { appendSystemMessage('Not connected; nothing to stop.'); return; }
            stopRequested = true;
            if (window.speechSynthesis) speechSynthesis.cancel();
            ws.send(JSON.stringify({ version: 1, action: 'control', sender: myUsername, sender_kind: 'html_client', target: 'all', command: 'stop' }));
            appendSystemMessage('Stop sent. The network is shutting down.');
        }

        function sendControl(target, command) {
            if (!ws || ws.readyState !== WebSocket.OPEN) { appendSystemMessage('Not connected: the command was not sent.'); return; }
            ws.send(JSON.stringify({ version: 1, action: 'control', sender: myUsername, sender_kind: 'html_client', target: target, command: command }));
            const who = target === 'all' ? 'all agents' : '@' + target;
            appendSystemMessage(`${command === 'pause' ? 'Pause' : 'Resume'} sent to ${who}.`);
        }

        function statusDot(name) {
            if (onlineKinds[name] !== 'agent') return 'bg-emerald-400';
            return onlinePaused[name] ? 'bg-rose-500' : 'bg-emerald-400';
        }

        function renderAgentControls() {
            const box = document.getElementById('agent-controls');
            const agents = Object.keys(onlineKinds).filter(name => onlineKinds[name] === 'agent');
            box.innerHTML = '';
            if (agents.length === 0) { box.innerHTML = '<div class="text-slate-500 text-xs">No agents connected.</div>'; return; }
            agents.forEach(name => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 px-2 py-1 rounded bg-slate-900/60';
                row.innerHTML = `<span class="flex items-center gap-2 text-slate-300 truncate"><span class="w-2 h-2 rounded-full ${statusDot(name)}"></span>${escapeHtml(name)}</span>`;
                const pause = document.createElement('button');
                pause.textContent = 'Pause'; pause.className = 'text-[11px] px-2 py-0.5 rounded bg-amber-900/40 text-amber-300 border border-amber-700/50';
                pause.onclick = () => sendControl(name, 'pause');
                const resume = document.createElement('button');
                resume.textContent = 'Resume'; resume.className = 'text-[11px] px-2 py-0.5 rounded bg-emerald-900/40 text-emerald-300 border border-emerald-700/50';
                resume.onclick = () => sendControl(name, 'resume');
                row.appendChild(pause); row.appendChild(resume); box.appendChild(row);
            });
        }

        function updateUserListUI() {
            const filteredUsers = onlineUsers.filter(u => u !== myUsername);
            userCount.textContent = onlineUsers.length;
            renderAgentControls();
            userList.innerHTML = `
                <button onclick="selectChatTarget('broadcast')" id="target-broadcast" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between ${activeTarget === 'broadcast' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-700/50 transition-colors'}">
                    <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-indigo-400"></span># Nexus Chat</span>
                </button>`;
            filteredUsers.forEach(user => {
                const isSelected = activeTarget === user;
                const button = document.createElement("button");
                button.id = `target-${user}`;
                button.onclick = () => selectChatTarget(user);
                button.className = `w-full text-left px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-between ${isSelected ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-700/50 transition-colors'}`;
                button.innerHTML = `<span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${statusDot(user)}"></span>@${escapeHtml(user)}</span><span class="text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded">DM</span>`;
                userList.appendChild(button);
            });
        }

        function handleSend(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message || !myUsername) return;
            if (activeTarget === "broadcast") {
                ws.send(JSON.stringify({ version: 1, action: "broadcast", sender: myUsername, sender_kind: "html_client", message: message }));
            } else {
                ws.send(JSON.stringify({ version: 1, action: "direct_message", sender: myUsername, sender_kind: "html_client", recipient: activeTarget, message: message }));
                appendChatMessage(myUsername, message, "direct", activeTarget);
            }
            messageInput.value = "";
        }

        function appendChatMessage(sender, message, mode, recipient = null) {
            chatUnsaved = true;
            const isSelf = sender === myUsername;
            const from = isSelf ? 'You' : `@${escapeHtml(sender)}`;
            const to = recipient ? `@${escapeHtml(recipient)}` : 'everyone';

            let labelColor = 'text-slate-400';
            let labelPrefix = '';
            let bgClass = 'bg-slate-800 text-slate-200 border border-slate-700 rounded-tl-none';

            if (isSelf) {
                bgClass = 'bg-indigo-600 text-white rounded-tr-none';
            }

            switch (mode) {
                case 'broadcast':
                    labelColor = 'text-sky-400';
                    labelPrefix = '📢 ';
                    break;
                case 'direct':
                    labelColor = 'text-emerald-400';
                    labelPrefix = '💬 ';
                    break;
                case 'agent_feed':
                    labelColor = 'text-amber-400';
                    labelPrefix = '🤖 ';
                    break;
                default:
                    labelColor = 'text-slate-400';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;
            msgDiv.innerHTML = `<span class="text-[11px] ${labelColor} mb-0.5 px-1">${labelPrefix}${from} to ${to}</span><div class="max-w-[80%] rounded-xl px-3.5 py-2 text-sm ${bgClass}">${escapeHtml(message)}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement("div");
            div.className = "text-center text-xs text-amber-400/90 my-2 bg-amber-950/30 border border-amber-800/30 rounded py-1 px-2";
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
        }

        window.onload = connectWebSocket;

        window.addEventListener("beforeunload", (event) => {
            if (chatUnsaved) { event.preventDefault(); event.returnValue = ""; }
        });
    </script>

    <script>
        document.addEventListener('click', function (e) {
            var sb = document.getElementById('nexus-sidebar');
            if (!sb || !sb.classList.contains('nexus-open')) return;
            if (!sb.contains(e.target)) { sb.classList.remove('nexus-open'); return; }
            var t = e.target;
            while (t && t !== sb) {
                if (t.tagName === 'BUTTON' && (t.getAttribute('onclick') || '').indexOf('selectChatTarget') >= 0) {
                    setTimeout(function () { sb.classList.remove('nexus-open'); }, 50);
                    return;
                }
                t = t.parentElement;
            }
        });
    </script>

    <script id="nexus-clock-updater">
      (function () {
        function tick() {
          var el = document.getElementById('nexus-clock');
          if (!el) return;
          var d = new Date();
          function z(n) { return String(n).padStart(2,'0'); }
          el.textContent = z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
        }
        tick(); setInterval(tick, 1000);
      })();
    </script>
</body>
</html>
