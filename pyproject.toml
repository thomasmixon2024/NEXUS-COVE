[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-cove"
version = "0.1.0"
description = "Local multi-agent orchestration framework with explicit task, transport, storage, and observability boundaries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["websockets>=16,<17"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
cove-server = "nexus_cove.transport.websocket.server:main"
cove-manager = "nexus_cove.orchestration.manager:main"
cove-worker = "nexus_cove.agents.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus_cove.agents" = ["personalities/*.toml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
